<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Safa Reads 📖</title>
  
  <!-- Google Fonts (async, non-blocking) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap"
        rel="stylesheet"
        media="print"
        onload="this.media='all'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">
  </noscript>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  
  <!-- Theme color -->
  <meta name="theme-color" content="#FF6B6B">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon-master.svg">
  
  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Safa Reads">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/assets/icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/icon-180.png">
  
  <!-- Microsoft Tiles -->
  <meta name="msapplication-TileColor" content="#FF6B6B">
  <meta name="msapplication-TileImage" content="/assets/icons/icon-144.png">
  
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <button id="toggleControls" class="header-toggle">›</button>

  <div class="header" id="controls">
    <div class="age-selector">
      <label for="age">Age:</label>
      <select id="age">
        <option value="5">5</option>
        <option value="6" selected>6</option>
        <option value="7">7</option>
        <option value="8">8</option>
      </select>
    </div>
    <div class="category-buttons">
      <button class="cat-btn" data-category="animals">Animals</button>
      <button class="cat-btn" data-category="colors">Colors</button>
      <button class="cat-btn" data-category="food">Food</button>
      <button class="cat-btn" data-category="family">Family</button>
      <button class="cat-btn" data-category="numbers">Numbers</button>
    </div>
    <button id="newWords" class="btn">New Words</button>
    <label class="auto-shuffle">
      <input type="checkbox" id="autoShuffle">
      Auto-shuffle (60s)
    </label>
    <button id="install-btn" class="install-button" aria-label="Install app" style="display:none;">
      📱 Install
    </button>
    <a href="/dashboard.html" class="dashboard-link" aria-label="Open parent dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 3v18h18M7 14l4-4 4 4 5-5"/>
      </svg>
      Dashboard
    </a>
  </div>

  <div id="online-status" class="offline-badge" style="display:none;">
    📴 Offline mode (still works!)
  </div>

  <div id="rotate-message" class="rotate-message">
    🔄 Please rotate for bigger words
  </div>

  <div id="progress" class="progress">Read: 0 / 0</div>

  <div id="wordContainer" class="word-container"></div>

  <script src="js/speech.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
