<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#FF6B6B"/>
  
  <!-- Open book shape -->
  <g transform="translate(256, 270)">
    <!-- Book cover (back) -->
    <rect x="-150" y="-110" width="300" height="220" rx="8" fill="#2D3436"/>
    
    <!-- Left page -->
    <path d="M-140,-100 Q-140,-110 -120,-110 L-10,-110 Q0,-110 0,-100 L0,90 Q0,100 -10,100 L-120,100 Q-140,100 -140,90 Z" 
          fill="#FFF9F0"/>
    <path d="M-140,-100 Q-140,-110 -120,-110 L-10,-110 Q0,-110 0,-100 L0,90 Q0,100 -10,100 L-120,100 Q-140,100 -140,90 Z" 
          stroke="#2D3436" stroke-width="3" fill="none"/>
    
    <!-- Right page -->
    <path d="M140,-100 Q140,-110 120,-110 L10,-110 Q0,-110 0,-100 L0,90 Q0,100 10,100 L120,100 Q140,100 140,90 Z" 
          fill="#FFF9F0"/>
    <path d="M140,-100 Q140,-110 120,-110 L10,-110 Q0,-110 0,-100 L0,90 Q0,100 10,100 L120,100 Q140,100 140,90 Z" 
          stroke="#2D3436" stroke-width="3" fill="none"/>
    
    <!-- Spine -->
    <rect x="-4" y="-100" width="8" height="200" fill="#DFE6E9"/>
    
    <!-- Letters on left page -->
    <text x="-70" y="-25" text-anchor="middle" font-family="Comic Sans MS, cursive, sans-serif" 
          font-size="70" font-weight="bold" fill="#FF6B6B">A</text>
    <text x="-70" y="55" text-anchor="middle" font-family="Comic Sans MS, cursive, sans-serif" 
          font-size="70" font-weight="bold" fill="#4ECDC4">a</text>
    
    <!-- Letters on right page -->
    <text x="70" y="-25" text-anchor="middle" font-family="Comic Sans MS, cursive, sans-serif" 
          font-size="70" font-weight="bold" fill="#27AE60">B</text>
    <text x="70" y="55" text-anchor="middle" font-family="Comic Sans MS, cursive, sans-serif" 
          font-size="70" font-weight="bold" fill="#8E44AD">b</text>
    
    <!-- Bookshelf line -->
    <rect x="-160" y="105" width="320" height="6" rx="3" fill="#2D3436"/>
  </g>
  
  <!-- Sparkle accents -->
  <circle cx="100" cy="100" r="12" fill="#FFE66D"/>
  <circle cx="420" cy="130" r="8" fill="#FFE66D"/>
  <circle cx="380" cy="420" r="10" fill="#FFE66D"/>
  <circle cx="140" cy="380" r="6" fill="#FFE66D"/>
</svg>